let index = 0;
let score = 0;
let user = "";
let totalTime = 1200;   // 20 minutes = 1200 seconds (change to 1800 for 30 mins)
let globalTimerId = null;
let userAnswers = [];   // stores selected answers
let timeTaken = 0;      // track time spent


function startQuiz() {
  user = document.getElementById("username").value.trim();
  if (!user) { alert("Enter your name"); return; }

  document.getElementById("nameBox").style.display = "none";
  document.getElementById("quizBox").style.display = "block";

  startGlobalTimer();   //  Start the global timer
  loadQuestion();
}

function loadQuestion() {
  const q = questions[index];
  document.getElementById("question").innerText = q.question;

  const optBox = document.getElementById("options");
  optBox.innerHTML = "";

  q.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(i);
    optBox.appendChild(btn);
  });

  document.getElementById("progress").innerText =
    `Question ${index+1} of ${questions.length}`;
}

function checkAnswer(i) {
  userAnswers[index] = i;   // store selected answer

  if (i === questions[index].answer) score++;
  index++;

  if (index < questions.length) loadQuestion();
  else finishQuiz();
}
function showFullReview() {
  const reviewBox = document.createElement("div");
  reviewBox.style.marginTop = "20px";
  reviewBox.style.padding = "15px";
  reviewBox.style.background = "#1f2937";
  reviewBox.style.borderRadius = "10px";

  let html = "<h2>Full Review</h2>";

  questions.forEach((q, i) => {
    const userAns = userAnswers[i];
    const correctAns = q.answer;

    html += `
      <div style="background:#374151; padding:10px; border-radius:8px; margin-top:10px;">
        <p><strong>${i+1}. ${q.question}</strong></p>
        <p>✔ Correct Answer: <span style="color:#10b981;">${q.options[correctAns]}</span></p>
        <p>🟦 Your Answer: 
          <span style="color:${userAns === correctAns ? '#10b981' : '#ef4444'};">
            ${userAns !== null ? q.options[userAns] : "No answer given"}
          </span>
        </p>
      </div>
    `;
  });

  reviewBox.innerHTML = html;
  document.getElementById("finalBox").appendChild(reviewBox);
}


function finishQuiz() {
  clearInterval(globalTimerId);
  document.getElementById("quizBox").style.display = "none";
  document.getElementById("finalBox").style.display = "block";

  document.getElementById("finalScore").innerText =
    `${user}, your score is ${score}/${questions.length}`;

  // TIME TAKEN
  const minutes = Math.floor(timeTaken / 60);
  const seconds = timeTaken % 60;

  const timeMsg = `Time Taken: ${minutes}m ${seconds}s`;

  const timeDisplay = document.createElement("p");
  timeDisplay.style.fontWeight = "bold";
  timeDisplay.style.color = "#10b981";
  timeDisplay.innerText = timeMsg;

  document.getElementById("finalBox").appendChild(timeDisplay);

  saveScore();
  showHistory();
  showFullReview();   // show all questions + answers + your choices
}

function startGlobalTimer() {
  globalTimerId = setInterval(() => {
    timeTaken++;     // NEW: count time spent
    totalTime--;     // countdown


    let minutes = Math.floor(totalTime / 60);
    let seconds = totalTime % 60;

    document.getElementById("timer").innerText =
      `Time Left: ${minutes}m ${seconds}s`;

    if (totalTime <= 0) {
      clearInterval(globalTimerId);
      finishQuiz();   // 🔥 Auto-submit when time ends
    }
  }, 1000);
}

function saveScore() {
  const record = {
    name: user,
    score: score,
    total: questions.length,
    time: new Date().toLocaleString()
  };

  let history = JSON.parse(localStorage.getItem("quizScores")) || [];
  history.push(record);
  localStorage.setItem("quizScores", JSON.stringify(history));
}

function showHistory() {
  document.getElementById("historyBox").style.display = "block";

  const history = JSON.parse(localStorage.getItem("quizScores")) || [];
  const list = document.getElementById("historyList");
  list.innerHTML = "";

  history.forEach(h => {
    const div = document.createElement("div");
    div.className = "score-item";
    div.innerText = `${h.name} — ${h.score}/${h.total} (${h.time})`;
    list.appendChild(div);
  });
}

function restart() {
  index = 0;
  score = 0;
  clearInterval(globalTimerId);   //  stop previous timer
  totalTime = 1200;               //  reset timer to 20 mins (or 1800 for 30 mins)
  document.getElementById("finalBox").style.display = "none";
  document.getElementById("historyBox").style.display = "none";
  document.getElementById("nameBox").style.display = "block";
}
</script>
